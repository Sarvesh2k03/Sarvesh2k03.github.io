name: Keep Portfolio Apps Awake

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  wake-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit portfolio apps
        run: python scripts/wake_apps.py
